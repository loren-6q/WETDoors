<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>W&W DOORS</title>
    <!-- Favicon: Lock Icon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322d3ee' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='11' x='3' y='11' rx='2' ry='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&family=JetBrains+Mono:wght@800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: black;
            -webkit-tap-highlight-color: transparent;
        }
        .font-mono {
            font-family: 'JetBrains+Mono', monospace;
        }
        input:focus, textarea:focus {
            outline: none;
        }
        ::-webkit-scrollbar {
            width: 0px;
        }
        .active-tab {
            background-color: #0891b2; /* cyan-600 */
            color: white;
            border-bottom-color: #67e8f9; /* cyan-300 */
        }
        .edit-overlay {
            display: none;
        }
        .edit-overlay.active {
            display: flex;
        }
    </style>
</head>
<body class="text-white selection:bg-cyan-500 overflow-x-hidden min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-neutral-900 border-b-4 border-cyan-600 p-1.5 sm:p-3 shadow-2xl">
        <!-- Top Row: Title, ALL, Search -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-2 px-1">
            <div class="flex items-center gap-1.5 shrink-0">
                <i data-lucide="key" class="w-8 h-8 text-cyan-400"></i>
                <h1 class="text-2xl font-black tracking-tighter italic text-white underline decoration-cyan-500 underline-offset-4 uppercase">W&W DOORS</h1>
            </div>
            
            <div class="flex items-center gap-1.5 w-full sm:w-auto h-[32px]">
                <button onclick="setActiveTab('ALL')" id="tab-ALL" class="tab-btn h-full px-4 rounded-lg text-sm font-black transition-all border-b-4 bg-neutral-800 text-neutral-500 border-neutral-700 leading-none shrink-0">ALL</button>
                <div class="relative w-full sm:w-[200px] h-full">
                    <i data-lucide="search" class="absolute left-2 top-1/2 -translate-y-1/2 w-4 h-4 text-cyan-500"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="SEARCH"
                        class="w-full h-full bg-neutral-800 border-2 border-neutral-700 rounded-lg pl-7 pr-1 text-sm font-black focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 placeholder:text-neutral-600"
                    >
                </div>
            </div>
        </div>

        <div class="flex flex-col gap-1.5">
            <!-- WET Tabs -->
            <div class="flex gap-1 items-center w-full h-[32px]" id="tabContainerWET">
                <div class="text-[10px] font-black text-neutral-500 w-[55px] text-right pr-2 tracking-widest shrink-0">WET:</div>
                <button onclick="setActiveTab('100s')" id="tab-100s" class="tab-btn flex-1 rounded-lg text-sm font-black transition-all border-b-4 bg-neutral-800 text-neutral-500 border-neutral-700 leading-none">100</button>
                <button onclick="setActiveTab('200s')" id="tab-200s" class="tab-btn flex-1 rounded-lg text-sm font-black transition-all border-b-4 bg-neutral-800 text-neutral-500 border-neutral-700 leading-none">200</button>
                <button onclick="setActiveTab('300s')" id="tab-300s" class="tab-btn flex-1 rounded-lg text-sm font-black transition-all border-b-4 bg-neutral-800 text-neutral-500 border-neutral-700 leading-none">300</button>
            </div>

            <!-- SWIMS Tabs -->
            <div class="flex gap-1 items-center w-full h-[32px]" id="tabContainerSWIMS">
                <div class="text-[10px] font-black text-neutral-500 w-[55px] text-right pr-2 tracking-widest shrink-0">SWIMS:</div>
                <button onclick="setActiveTab('A')" id="tab-A" class="tab-btn flex-1 rounded-lg text-sm font-black transition-all border-b-4 bg-neutral-800 text-neutral-500 border-neutral-700 leading-none">A</button>
                <button onclick="setActiveTab('B')" id="tab-B" class="tab-btn flex-1 rounded-lg text-sm font-black transition-all border-b-4 bg-neutral-800 text-neutral-500 border-neutral-700 leading-none">B</button>
                <button onclick="setActiveTab('C')" id="tab-C" class="tab-btn flex-1 rounded-lg text-sm font-black transition-all border-b-4 bg-neutral-800 text-neutral-500 border-neutral-700 leading-none">C</button>
                <button onclick="setActiveTab('D')" id="tab-D" class="tab-btn flex-1 rounded-lg text-sm font-black transition-all border-b-4 bg-neutral-800 text-neutral-500 border-neutral-700 leading-none">D</button>
            </div>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="p-1 sm:p-2 max-w-6xl mx-auto flex-1 w-full">
        <div id="roomGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-1.5">
            <!-- Syncing Message -->
            <div id="loadingState" class="col-span-full py-20 text-center">
                <p class="text-neutral-600 font-bold uppercase tracking-[0.3em] animate-pulse">Connecting to Database...</p>
            </div>
        </div>
    </main>

    <!-- Persistence Footer -->
    <footer class="text-[9px] text-center py-4 text-neutral-700 font-black uppercase tracking-[0.2em] border-t border-neutral-900 mt-2 mb-12">
        W&W DOORS SECURE CLOUD SYNC ACTIVE
    </footer>

    <!-- Edit Overlay -->
    <div id="editOverlay" class="edit-overlay fixed inset-0 z-50 items-center justify-center bg-black/95 backdrop-blur-md p-4">
        <div class="bg-neutral-900 w-full max-w-sm rounded-[2rem] p-6 border-4 border-cyan-600 shadow-2xl">
            <div class="flex items-center justify-between mb-6">
                <h2 id="editRoomTitle" class="text-6xl font-black italic tracking-tighter text-white uppercase">RM ---</h2>
                <button onclick="closeEdit()" class="p-3 bg-neutral-800 rounded-full border border-neutral-700 text-white">
                    <i data-lucide="x" class="w-8 h-8"></i>
                </button>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="text-sm font-black text-neutral-400 uppercase tracking-widest mb-2 block">ENTRY CODE</label>
                    <div class="relative">
                        <i data-lucide="hash" class="absolute left-4 top-1/2 -translate-y-1/2 w-6 h-6 text-cyan-500"></i>
                        <input 
                            type="text" 
                            id="editCodeInput"
                            class="w-full bg-neutral-800 border-2 border-neutral-700 rounded-2xl py-6 px-4 text-5xl font-mono font-black text-cyan-400 text-center focus:ring-4 focus:ring-cyan-500/50 focus:border-cyan-500 outline-none"
                        >
                    </div>
                </div>

                <div>
                    <label class="text-sm font-black text-neutral-400 uppercase tracking-widest mb-2 block">NOTES</label>
                    <textarea 
                        id="editNoteInput"
                        class="w-full bg-neutral-800 border-2 border-neutral-700 rounded-2xl p-4 text-xl font-bold text-white focus:ring-4 focus:ring-cyan-500/50 focus:border-cyan-500 min-h-[100px] outline-none"
                        placeholder="..."
                    ></textarea>
                </div>

                <button 
                    onclick="saveChanges()"
                    class="w-full bg-cyan-600 py-6 rounded-2xl text-3xl font-black text-white shadow-xl shadow-cyan-600/30 active:scale-95 transition-all flex items-center justify-center gap-3 border-b-8 border-cyan-800"
                >
                    <i data-lucide="save" class="w-10 h-10"></i> SAVE
                </button>
            </div>
        </div>
    </div>

    <!-- Status Toast -->
    <div id="toast" class="fixed bottom-12 left-1/2 -translate-x-1/2 px-8 py-4 rounded-2xl bg-cyan-600 text-white font-black text-2xl z-[60] shadow-2xl border-2 border-cyan-400 hidden items-center gap-3 animate-bounce">
        <i data-lucide="lock" class="w-8 h-8"></i> <span id="toastText">SAVED</span>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        let firebaseConfig = {
            apiKey: "AIzaSyC2WjPkEsOJE5-Zzqum68OlViNgwDobvEs",
            authDomain: "wet-doors.firebaseapp.com",
            projectId: "wet-doors",
            storageBucket: "wet-doors.firebasestorage.app",
            messagingSenderId: "463062556147",
            appId: "1:463062556147:web:4ddccdfe67cd4d3b974686"
        };

        if (typeof __firebase_config !== 'undefined') {
            firebaseConfig = JSON.parse(__firebase_config);
        }

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'door-code-manager';
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const COLLECTION_NAME = 'door_codes';

        const INITIAL_DATA = {
            // --- WET DOORS ---
            "101": { code: "C269", notes: "" }, "102": { code: "C247", notes: "" },
            "103": { code: "C314", notes: "" }, "104": { code: "C167", notes: "" },
            "105": { code: "C259", notes: "" }, "106": { code: "C348", notes: "" },
            "201": { code: "C389", notes: "" }, "202": { code: "C169", notes: "" },
            "203": { code: "C314", notes: "" }, "204": { code: "C238", notes: "" },
            "205": { code: "C258", notes: "" }, "207": { code: "C468", notes: "" },
            "208": { code: "C268", notes: "" }, "210": { code: "C279", notes: "" },
            "211": { code: "C457", notes: "" }, "P2":  { code: "C213", notes: "Parking/Entry" },
            "301": { code: "C268", notes: "" }, "302": { code: "C259", notes: "" },
            "303": { code: "C124", notes: "" }, "304": { code: "C268", notes: "" },
            "305": { code: "C567", notes: "" }, "306": { code: "C327", notes: "" },
            "307": { code: "C456", notes: "" }, "308": { code: "C147", notes: "" },
            "309": { code: "C359", notes: "" }, "310": { code: "C137", notes: "" },
            "311": { code: "C567", notes: "" }, "312": { code: "C389", notes: "" },
            "313": { code: "C249", notes: "" }, "314": { code: "C125", notes: "" },
            "316": { code: "C348", notes: "" },

            // --- SWIMS A ZONE ---
            "A1": { code: "C03479", notes: "" }, "A2": { code: "C45789", notes: "" },
            "A3": { code: "C245XZ", notes: "" }, "A4": { code: "C3457Z", notes: "" },
            "A5": { code: "C3489X", notes: "" }, "A6": { code: "C23589", notes: "" },
            "A7": { code: "C3489X", notes: "" }, "A8": { code: "C3489X", notes: "" },
            "A9": { code: "C02489", notes: "" }, "A10": { code: "C4589Z", notes: "" },
            "A11": { code: "C3457Z", notes: "" }, "A12": { code: "C369", notes: "" },

            // --- SWIMS B ZONE ---
            "B1": { code: "C23589", notes: "" }, "B2": { code: "C4589Z", notes: "" },
            "B3": { code: "C34589", notes: "" }, "B4": { code: "C3457Z", notes: "" },
            "B5": { code: "C23589", notes: "" }, "B6": { code: "C03479", notes: "" },
            "B7": { code: "C3479X", notes: "" }, "B8": { code: "C5789X", notes: "" },
            "B9": { code: "C234XZ", notes: "" }, "B10": { code: "C234XZ", notes: "" },
            "B11": { code: "C03479", notes: "" }, "B12": { code: "C24578", notes: "" },
            "B13": { code: "C23489", notes: "" }, "B14": { code: "C245XZ", notes: "" },
            "B15": { code: "C34589", notes: "" }, "B16": { code: "C3478Z", notes: "" },
            "B17": { code: "C23589", notes: "" }, "B18": { code: "C3489X", notes: "" },
            "B19": { code: "C3457Z", notes: "" }, "B20": { code: "C245XZ", notes: "" },
            "B21": { code: "C03479", notes: "" },

            // --- SWIMS C ZONE ---
            "C101": { code: "----", notes: "" }, "C102": { code: "----", notes: "" }, 
            "C103": { code: "----", notes: "" },
            "C201": { code: "C3478Z", notes: "" }, "C202": { code: "C4589X", notes: "" }, 
            "C203": { code: "C45789", notes: "" }, "C204": { code: "C4589Z", notes: "" }, 
            "C205": { code: "C02489", notes: "" }, "C206": { code: "C3478Z", notes: "" }, 
            "C207": { code: "C34589", notes: "" }, "C208": { code: "C234XZ", notes: "" }, 
            "C209": { code: "C34589", notes: "" }, "C210": { code: "C4589X", notes: "" }, 
            "C211": { code: "C24578", notes: "" }, "C212": { code: "C02489", notes: "" },
            "C301": { code: "C23489", notes: "" }, "C302": { code: "C3457Z", notes: "" }, 
            "C303": { code: "C24789", notes: "" }, "C304": { code: "C3489X", notes: "" }, 
            "C305": { code: "C45789", notes: "" }, "C306": { code: "C34589", notes: "" }, 
            "C307": { code: "C3478X", notes: "" }, "C308": { code: "C45789", notes: "" }, 
            "C309": { code: "C2348Z", notes: "" }, "C310": { code: "C4589Z", notes: "" }, 
            "C311": { code: "C5789X", notes: "" }, "C312": { code: "----", notes: "" },

            // --- SWIMS D ZONE ---
            "D1": { code: "----", notes: "" }, "D2": { code: "----", notes: "" },
            "D3": { code: "----", notes: "" }, "D4": { code: "----", notes: "" },
            "D5": { code: "----", notes: "" }, "D6": { code: "----", notes: "" },
            "D7": { code: "----", notes: "" }, "D8": { code: "----", notes: "" },
            "D9": { code: "----", notes: "" }, "D10": { code: "----", notes: "" },
            "D11": { code: "----", notes: "" }
        };

        let rooms = {};
        let activeTab = 'ALL';
        let currentEditingId = null;
        let searchTerm = '';

        async function startApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth failed:", err);
            }

            onAuthStateChanged(auth, (user) => {
                if (!user) return;
                
                const roomsRef = collection(db, 'artifacts', appId, 'public', 'data', COLLECTION_NAME);
                
                onSnapshot(roomsRef, async (snapshot) => {
                    if (snapshot.empty) {
                        const batch = writeBatch(db);
                        Object.entries(INITIAL_DATA).forEach(([id, data]) => {
                            batch.set(doc(roomsRef, id), { ...data, lastUpdated: Date.now() });
                        });
                        try {
                            await batch.commit();
                        } catch (e) {
                            console.error("Seeding failed:", e);
                        }
                        rooms = INITIAL_DATA;
                    } else {
                        // Merge db data with INITIAL_DATA so new rooms appear even if DB exists
                        rooms = { ...INITIAL_DATA }; 
                        snapshot.forEach(doc => rooms[doc.id] = doc.data());
                    }
                    render();
                }, (error) => {
                    console.error("Firestore sync error:", error);
                    rooms = INITIAL_DATA;
                    render();
                });
            });
        }

        window.setActiveTab = (tab) => {
            activeTab = tab;
            searchTerm = '';
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.value = '';
            
            // Hide tabs block on mobile if searching
            document.getElementById('tabContainerWET').style.display = 'flex';
            document.getElementById('tabContainerSWIMS').style.display = 'flex';
            
            render();
        };

        window.openEdit = (id) => {
            currentEditingId = id;
            const room = rooms[id];
            if (!room) return;
            document.getElementById('editRoomTitle').innerText = `${id}`;
            document.getElementById('editCodeInput').value = room.code;
            document.getElementById('editNoteInput').value = room.notes || '';
            document.getElementById('editOverlay').classList.add('active');
            lucide.createIcons();
        };

        window.closeEdit = () => {
            document.getElementById('editOverlay').classList.remove('active');
            currentEditingId = null;
        };

        window.saveChanges = async () => {
            if (!currentEditingId || !auth.currentUser) return;
            const newCode = document.getElementById('editCodeInput').value.toUpperCase();
            const newNote = document.getElementById('editNoteInput').value;
            
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', COLLECTION_NAME, currentEditingId);
                await setDoc(docRef, { code: newCode, notes: newNote, lastUpdated: Date.now() }, { merge: true });
                closeEdit();
                showStatus(`UPDATED ${currentEditingId}`);
            } catch (err) {
                console.error("Save error:", err);
                showStatus("Error Saving");
            }
        };

        function showStatus(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').innerText = text;
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 3000);
        }

        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                searchTerm = e.target.value.toLowerCase();
                if(searchTerm.length > 0) {
                     document.getElementById('tabContainerWET').style.display = 'none';
                     document.getElementById('tabContainerSWIMS').style.display = 'none';
                } else {
                     document.getElementById('tabContainerWET').style.display = 'flex';
                     document.getElementById('tabContainerSWIMS').style.display = 'flex';
                }
                render();
            });
        }

        function render() {
            const grid = document.getElementById('roomGrid');
            if (!grid) return;
            grid.innerHTML = '';

            const loadingState = document.getElementById('loadingState');
            if (loadingState) loadingState.remove();

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
            if (!searchTerm) {
                const tabBtn = document.getElementById(`tab-${activeTab}`);
                if (tabBtn) tabBtn.classList.add('active-tab');
            }

            const roomList = Object.entries(rooms).map(([id, data]) => ({ id, ...data }));
            
            const filtered = roomList.filter(r => {
                if (searchTerm) {
                    return r.id.toLowerCase().includes(searchTerm) || r.code.toLowerCase().includes(searchTerm);
                }
                if (activeTab === 'ALL') return true;
                if (activeTab === '100s') return r.id.startsWith('1') && !r.id.startsWith('C1');
                if (activeTab === '200s') return (r.id.startsWith('2') || r.id === 'P2') && !r.id.startsWith('C2');
                if (activeTab === '300s') return r.id.startsWith('3') && !r.id.startsWith('C3');
                
                if (activeTab === 'A') return r.id.startsWith('A');
                if (activeTab === 'B') return r.id.startsWith('B');
                if (activeTab === 'C') return r.id.startsWith('C');
                if (activeTab === 'D') return r.id.startsWith('D');
                
                return false;
            }).sort((a,b) => {
                // Natural sort (e.g. A2 comes before A10)
                return a.id.localeCompare(b.id, undefined, {numeric: true, sensitivity: 'base'});
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-10 text-center text-neutral-600 font-bold uppercase tracking-widest">No matching rooms</div>';
                return;
            }

            filtered.forEach(room => {
                const card = document.createElement('div');
                card.className = "bg-neutral-900 border-2 border-neutral-800 rounded-lg flex flex-col items-center justify-between py-2 px-1 active:bg-cyan-900 active:border-cyan-500 transition-all cursor-pointer shadow-lg";
                card.onclick = () => openEdit(room.id);
                card.innerHTML = `
                    <div class="w-full flex flex-col items-center">
                        <h3 class="text-3xl font-black leading-none tracking-tighter text-white mb-1">${room.id}</h3>
                    </div>
                    <div class="w-full border-t border-neutral-800 mt-1 pt-1.5 flex flex-col items-center">
                        <div class="text-2xl sm:text-3xl font-mono font-black text-cyan-400 leading-none tracking-tighter text-center" style="word-break: break-all;">${room.code}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        startApp();
        lucide.createIcons();
    </script>
    
    <!-- External WET Nav Script -->
    <script src="https://loren-6q.github.io/WETNav/nav.js"></script>
</body>
</html>
